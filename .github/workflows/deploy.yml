name: Deploy

# 只有发布正式 Release 才部署；main 合并和预发布版本只运行 CI。
on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # 不使用 target_commitish：已有 tag 时它未必等于实际发布的提交。
      - name: Verify release commit and CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag 必须与 package.json 的版本一致（v<version>）"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release 提交不属于 main"
            exit 1
          }
          gh run list --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 \
            --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' || {
            echo "::error::Release 提交的 main CI 尚未成功；待 CI 通过后重新运行本工作流"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # 部署经过校验的不可变 SHA，避免 tag 在校验后被移动。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      # 目标账号下若还没有 D1 / KV，先按名字创建并把 ID 回填进 wrangler.jsonc。
      # 资源 ID 是账号相关的：仓库里写死的是旧账号的值，换账号后必须重新绑定，
      # 否则部署会因「绑定不存在」直接失败。
      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          d1_name=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const text = readFileSync('wrangler.jsonc','utf8')
            const match = text.match(/\"database_name\":\s*\"([^\"]+)\"/)
            process.stdout.write(match ? match[1] : '')
          ")
          if [ -z "$d1_name" ]; then
            echo "::error::无法从 wrangler.jsonc 读出 database_name"
            exit 1
          fi
          # 已存在则直接取 ID，不存在则创建。--json 输出便于解析，避免依赖文案。
          d1_id=$(pnpm exec wrangler d1 list --json \
            | node --input-type=module -e "
              let raw = ''
              for await (const chunk of process.stdin) raw += chunk
              const list = JSON.parse(raw)
              const hit = list.find((db) => db.name === process.argv[1])
              process.stdout.write(hit ? hit.uuid : '')
            " "$d1_name")
          if [ -z "$d1_id" ]; then
            echo "创建 D1 数据库 $d1_name"
            d1_id=$(curl -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              --data "{\"name\":\"$d1_name\"}" \
              | node --input-type=module -e "
                let raw = ''
                for await (const chunk of process.stdin) raw += chunk
                const body = JSON.parse(raw)
                if (!body.success) {
                  console.error('D1 创建失败：' + JSON.stringify(body.errors))
                  process.exit(1)
                }
                process.stdout.write(body.result.uuid)
              ")
          fi
          if [ -z "$d1_id" ]; then
            echo "::error::D1 数据库 $d1_name 创建失败或无法取得 ID"
            exit 1
          fi
          kv_id=$(pnpm exec wrangler kv namespace list \
            | node --input-type=module -e "
              let raw = ''
              for await (const chunk of process.stdin) raw += chunk
              const list = JSON.parse(raw)
              // 标题即 wrangler.jsonc 里的 KV 名称；按标题找，避免依赖输出顺序。
              const hit = list.find((ns) => ns.title === 'saas-template-cache')
              process.stdout.write(hit ? hit.id : '')
            ")
          if [ -z "$kv_id" ]; then
            echo "创建 KV 命名空间 saas-template-cache"
            kv_id=$(curl -sS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              --data '{"title":"saas-template-cache"}' \
              | node --input-type=module -e "
                let raw = ''
                for await (const chunk of process.stdin) raw += chunk
                const body = JSON.parse(raw)
                if (!body.success) {
                  console.error('KV 创建失败：' + JSON.stringify(body.errors))
                  process.exit(1)
                }
                process.stdout.write(body.result.id)
              ")
          fi
          if [ -z "$kv_id" ]; then
            echo "::error::KV 命名空间 CACHE 创建失败或无法取得 ID"
            exit 1
          fi
          echo "D1 $d1_name = $d1_id"
          echo "KV CACHE = $kv_id"
          # 回填 wrangler.jsonc：KV 命名空间 ID 用 sed 精确替换，D1 用 node。
          sed -i "s/\"binding\": \"CACHE\", \"id\": \"[0-9a-f]*\"/\"binding\": \"CACHE\", \"id\": \"$kv_id\"/" wrangler.jsonc
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs'
            const file = 'wrangler.jsonc'
            const text = readFileSync(file, 'utf8')
            const updated = text.replace(/(\"database_id\":\s*\")[0-9a-f-]*(\")/, '\$1' + process.argv[1] + '\$2')
            if (updated === text) {
              console.error('未在 wrangler.jsonc 中找到 database_id')
              process.exit(1)
            }
            writeFileSync(file, updated)
          " "$d1_id"
          # 迁移必须先于部署：Worker 启动即访问 users 表，缺表会让所有走会话的请求 500。
          echo "应用 D1 迁移"
          pnpm exec wrangler d1 migrations apply DB --remote
      - name: Validate, build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          pnpm run check:env:prod
          pnpm run build
          pnpm run check:client-bundle
          # 仅上传明确列出的运行时字段，不把 Cloudflare 部署凭据送入 Worker。
          # 临时文件权限受限，命令退出时清理；不输出任何 secret 值。
          umask 077
          secrets_file=$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module - "$secrets_file" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const keys = [
            'BETTER_AUTH_SECRET', 'BETTER_AUTH_URL', 'RESEND_API_KEY', 'MAIL_FROM',
            'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET', 'DISCORD_WEBHOOK_URL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'TURNSTILE_SECRET_KEY', 'ADMIN_EMAILS',
          ]
          const bindings = Object.fromEntries(keys.filter(key => process.env[key]).map(key => [key, process.env[key]]))
          writeFileSync(process.argv[2], JSON.stringify(bindings))
          NODE
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
        run: |
          set -euo pipefail
          for path in / /docs/getting-started; do
            code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -L -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "::error::冒烟检查失败：$path 返回 $code"
              exit 1
            fi
          done
          code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/get-session")
          echo "/api/auth/get-session → $code"
          case "$code" in
            2*) ;;
            *) echo "::error::认证端点响应异常，检查认证 secret 与 D1 绑定"; exit 1 ;;
          esac
