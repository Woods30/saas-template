name: Deploy

# 两条入口，走同一套 Secrets 与部署步骤：
# - Release 发布（tag 必须与 package.json 版本一致）
# - 日常部署：手动触发 `gh workflow run deploy.yml`，本地不需要任何 live 密钥
# main 合并只运行 CI，不部署。**不区分预发布**：Release 一发布就部署。
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    # 手动触发没有 release 可校验，跳过；deploy 会退回部署触发时的提交。
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # 不使用 target_commitish：已有 tag 时它未必等于实际发布的提交。
      - name: Verify release commit and CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag 必须与 package.json 的版本一致（v<version>）"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release 提交不属于 main"
            exit 1
          }
          gh run list --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 \
            --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' || {
            echo "::error::Release 提交的 main CI 尚未成功；待 CI 通过后重新运行本工作流"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-release
    # 只放行两种来源：
    # 1) Release 通过校验（verify-release 成功）
    # 2) 手动触发，且 ref 必须是 main（否则等于用生产密钥执行任意分支的代码）
    if: >
      always() && (
        needs.verify-release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # 部署经过校验的不可变 SHA，避免 tag 在校验后被移动。
      # 手动触发时 verify-release 被跳过，退回触发时的提交。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-release.outputs.sha || github.sha }}
          persist-credentials: false
      # 手动触发同样要求该提交的 CI 已通过——生产部署不因入口不同而降低门槛。
      - name: Verify CI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh run list --workflow ci.yml --branch main --event push --commit "$SHA" --limit 1 \
            --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' || {
            echo "::error::该提交的 CI 尚未成功；待 CI 通过后再触发部署"
            exit 1
          }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      # 目标账号下若还没有 D1 / KV，先按名字创建并把 ID 回填进 wrangler.jsonc。
      # 资源 ID 是账号相关的：仓库里写死的是旧账号的值，换账号后必须重新绑定，
      # 否则部署会因「绑定不存在」直接失败。
      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const token = process.env.CLOUDFLARE_API_TOKEN
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          if (!token || !accountId) {
            console.error('::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID')
            process.exit(1)
          }

          async function api(path, init) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init?.headers ?? {}),
              },
            })
            const body = await response.json().catch(() => ({}))
            if (!body.success) {
              const detail = JSON.stringify(body.errors ?? body)
              throw new Error(`${init?.method ?? 'GET'} ${path} 失败：${detail}`)
            }
            return body.result
          }

          // 前置诊断：分开报告「token 无效 / Account ID 不匹配」与「权限不足」，
          // 否则两者都表现为 code 10000，无法判断该改哪一个。
          let account
          try {
            account = await api(`/accounts/${accountId}`)
          } catch (error) {
            throw new Error(
              `无法读取账号 ${accountId}：token 无效、已吊销，或该 token 属于另一个账号。${error.message}`,
            )
          }
          console.log(`账号：${account.name} (${accountId})`)

          // 逐项探测权限，收集全部缺失项后统一报错：只报第一个会让用户补齐后再失败一次。
          const missing = []
          try {
            await api(`/accounts/${accountId}/d1/database`)
          } catch {
            missing.push('D1 → Edit')
          }
          try {
            await api(`/accounts/${accountId}/storage/kv/namespaces`)
          } catch {
            missing.push('Workers KV Storage → Edit')
          }
          if (missing.length > 0) {
            throw new Error(
              `token 可以读取账号 ${account.name}，但缺少以下权限：${missing.join('、')}。` +
                '请在 Cloudflare Dashboard → My Profile → API Tokens 为该账号新建一个包含这些权限的 token，' +
                '并更新 GitHub production Environment 的 CLOUDFLARE_API_TOKEN。',
            )
          }

          const config = readFileSync('wrangler.jsonc', 'utf8')
          const d1Name = config.match(/"database_name":\s*"([^"]+)"/)?.[1]
          const workerName = config.match(/"name":\s*"([^"]+)"/)?.[1]
          const kvId = config.match(/"binding":\s*"CACHE",\s*"id":\s*"([^"]+)"/)?.[1]
          if (!d1Name) throw new Error('wrangler.jsonc 中缺少 database_name')
          if (!workerName) throw new Error('wrangler.jsonc 中缺少 name')
          // KV 命名空间的标题不在 wrangler.jsonc 里（那里只有 binding 与 id），
          // 按「Worker 名 + -cache」推导，与 D1 的 database_name 同源。
          const kvTitle = `${workerName}-cache`

          const databases = await api(`/accounts/${accountId}/d1/database`)
          let d1 = databases.find((db) => db.name === d1Name)
          if (!d1) {
            console.log(`创建 D1 数据库 ${d1Name}`)
            d1 = await api(`/accounts/${accountId}/d1/database`, {
              method: 'POST',
              body: JSON.stringify({ name: d1Name }),
            })
          }

          const namespaces = await api(`/accounts/${accountId}/storage/kv/namespaces`)
          // 先按 id 找：改过 Worker 名或沿用旧命名空间时不必新建，
          // 也不必把命名空间改名 —— id 才是绑定关系的真相。
          let kv = kvId ? namespaces.find((ns) => ns.id === kvId) : undefined
          if (!kv) kv = namespaces.find((ns) => ns.title === kvTitle)
          if (!kv) {
            console.log(`创建 KV 命名空间 ${kvTitle}`)
            kv = await api(`/accounts/${accountId}/storage/kv/namespaces`, {
              method: 'POST',
              body: JSON.stringify({ title: kvTitle }),
            })
          }

          console.log(`D1 ${d1Name} = ${d1.uuid}`)
          console.log(`KV ${kvTitle} = ${kv.id}`)

          // 回填资源 ID，保留文件内注释（wrangler --update-config 会抹掉注释）。
          const d1Pattern = /(\"database_id\":\s*\")[0-9a-f-]*(\")/
          const kvPattern = /(\"binding\": \"CACHE\", \"id\": \")[0-9a-f]*(\")/
          if (!d1Pattern.test(config) || !kvPattern.test(config)) {
            throw new Error('回填失败：wrangler.jsonc 中未找到 database_id 或 KV id 字段')
          }
          const updated = config
            .replace(d1Pattern, `$1${d1.uuid}$2`)
            .replace(kvPattern, `$1${kv.id}$2`)
          writeFileSync('wrangler.jsonc', updated)
          NODE
          # 迁移不入库：生产库结构变更需本地生成迁移后手工 apply（wrangler d1 migrations apply DB --remote 或 pnpm db:migrate:pg）。
      - name: Validate, build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          # 自定义域名要能读 zone 的 token 才能建；没有时只发到 workers.dev。
          DEPLOY_SKIP_CUSTOM_DOMAIN: ${{ vars.DEPLOY_SKIP_CUSTOM_DOMAIN }}
          # 启动必需的 secret。支付 / 邮件 / 分析的凭据在数据库里（ADR-0010），
          # 不再进构建与部署环境；首部署后在后台「系统设置」里填写，
          # 或用带 env 的 `pnpm db:seed` 写进远端库。
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CONFIG_ENCRYPTION_KEY: ${{ secrets.CONFIG_ENCRYPTION_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          pnpm run check:env:prod
          # 建自定义域名需要 zone 权限的 token；没有时去掉 routes，
          # Worker 只发布到 workers.dev —— 域名之后再在 Dashboard 里挂。
          if [ "${DEPLOY_SKIP_CUSTOM_DOMAIN:-}" = "true" ]; then
            node -e "const fs=require('fs');const p='wrangler.jsonc';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace(/\"routes\":\s*\[[^\]]*\]/,'\"routes\": []'))"
            echo "已去掉自定义域名路由：Worker 只发布到 workers.dev"
          fi
          pnpm run build
          pnpm run check:client-bundle
          # 仅上传明确列出的运行时字段，不把 Cloudflare 部署凭据送入 Worker。
          # 临时文件权限受限，命令退出时清理；不输出任何 secret 值。
          umask 077
          secrets_file=$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module - "$secrets_file" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const keys = [
            'BETTER_AUTH_SECRET', 'BETTER_AUTH_URL', 'CONFIG_ENCRYPTION_KEY', 'ADMIN_EMAILS',
          ]
          const bindings = Object.fromEntries(keys.filter(key => process.env[key]).map(key => [key, process.env[key]]))
          writeFileSync(process.argv[2], JSON.stringify(bindings))
          NODE
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
        run: |
          set -euo pipefail
          # 首次绑定自定义域名时 DNS 与证书签发需要时间（通常几分钟）。直接检查会以
          # 「Could not resolve host」失败，掩盖真正的部署问题，故先等待域名就绪。
          echo "等待 $BASE_URL 可解析并响应…"
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL/" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "就绪（第 $attempt 次探测，HTTP $code）"
              ready=1
              break
            fi
            echo "第 $attempt 次探测：HTTP $code，5 秒后重试"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::5 分钟内 $BASE_URL 未就绪；检查自定义域名绑定与 DNS 记录"
            exit 1
          fi
          # 冒烟路径用 /pricing：它是首页定价锚点的正式地址，站内始终可用。
          for path in / /pricing; do
            code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -L -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "::error::冒烟检查失败：$path 返回 $code"
              exit 1
            fi
          done
          # 认证模块默认开启；端点异常通常意味着 secret 或 D1 绑定没配好。
          code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/get-session")
          echo "/api/auth/get-session → $code"
          case "$code" in
            2*) ;;
            *) echo "::error::认证端点响应异常，检查认证 secret 与 D1 绑定"; exit 1 ;;
          esac
