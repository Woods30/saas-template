name: Deploy

# 触发条件：CI 在 main 上成功之后。用 `workflow_run` 而非独立的 `push` 触发器，
# 是为了让「CI 绿」成为部署的硬前置。
#
# ⚠️ 安全：`workflow_run` 的经典陷阱是 pwn request。本仓库 public，任何人可 fork，
# 而 `on.branches` 匹配的是**头分支**（fork 方可自行命名为 `main`），挡不住攻击者。
# 真正的防线是 job 的 `if` 里那条 `head_repository.full_name == github.repository`——
# 不要删。删掉后 fork PR 的提交会在带生产 secret 的环境里执行，攻击者即可拿到
# CLOUDFLARE_API_TOKEN。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 串行部署；不设 cancel-in-progress，中途打断可能留下半新半旧的状态。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 部署凭据走下面的 env，不依赖 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 两个条件缺一不可：CI 必须通过，且 head_repository 是本仓库（拒绝 fork）。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 20
    env:
      # 直接经 env 注入，不创建 `.env.production`：`check-env-prod.ts` 在文件不存在时
      # 回退到进程 env，这样 secret 不会落到 CI 磁盘上。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      # 纵深防御：head_sha 本就被 GitHub 约束为提交 SHA，仍显式校验一次。
      - name: Validate ref
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::head_sha 不是合法的提交 SHA，拒绝继续"
            exit 1
          fi
      # action 固定在 commit SHA 上而非可变标签，防止供应链投毒。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 必须部署通过 CI 的那个提交，而不是默认分支的最新提交。
          ref: ${{ github.event.workflow_run.head_sha }}
      # pnpm 版本取自 package.json 的 packageManager，不在此硬编码。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      # = 生产 env 校验 → 构建 → bundle 泄漏检查 → wrangler deploy
      - run: pnpm run deploy
      # 冒烟检查：只查 wrangler 退出码抓不到「部署成功但页面 500」（如 secret 缺失）。
      - name: Smoke test
        env:
          BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          for path in / /docs/getting-started; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "::error::冒烟检查失败：$BASE_URL$path 返回 $code"
              exit 1
            fi
          done
          # 无会话时正确响应是 200 + null，故只拒绝 5xx。
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/get-session")
          echo "/api/auth/get-session → $code"
          case "$code" in
            5*) echo "::error::认证端点返回 $code，检查 BETTER_AUTH_SECRET 与 D1 绑定"; exit 1 ;;
          esac
