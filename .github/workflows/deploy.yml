name: Deploy

# 只有发布正式 Release 才部署；main 合并和预发布版本只运行 CI。
on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # 不使用 target_commitish：已有 tag 时它未必等于实际发布的提交。
      - name: Verify release commit and CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag 必须与 package.json 的版本一致（v<version>）"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release 提交不属于 main"
            exit 1
          }
          gh run list --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 \
            --json status,conclusion | jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' || {
            echo "::error::Release 提交的 main CI 尚未成功；待 CI 通过后重新运行本工作流"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      # 部署经过校验的不可变 SHA，避免 tag 在校验后被移动。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      # 目标账号下若还没有 D1 / KV，先按名字创建并把 ID 回填进 wrangler.jsonc。
      # 资源 ID 是账号相关的：仓库里写死的是旧账号的值，换账号后必须重新绑定，
      # 否则部署会因「绑定不存在」直接失败。
      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const token = process.env.CLOUDFLARE_API_TOKEN
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          if (!token || !accountId) {
            console.error('::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID')
            process.exit(1)
          }

          async function api(path, init) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init?.headers ?? {}),
              },
            })
            const body = await response.json().catch(() => ({}))
            if (!body.success) {
              const detail = JSON.stringify(body.errors ?? body)
              throw new Error(`${init?.method ?? 'GET'} ${path} 失败：${detail}`)
            }
            return body.result
          }

          // 前置诊断：分开报告「token 无效 / Account ID 不匹配」与「权限不足」，
          // 否则两者都表现为 code 10000，无法判断该改哪一个。
          let account
          try {
            account = await api(`/accounts/${accountId}`)
          } catch (error) {
            throw new Error(
              `无法读取账号 ${accountId}：token 无效、已吊销，或该 token 属于另一个账号。${error.message}`,
            )
          }
          console.log(`账号：${account.name} (${accountId})`)

          try {
            await api(`/accounts/${accountId}/d1/database`)
          } catch (error) {
            throw new Error(
              `token 可以读取账号，但无法访问 D1：请为它添加「D1 → Edit」权限。${error.message}`,
            )
          }
          try {
            await api(`/accounts/${accountId}/storage/kv/namespaces`)
          } catch (error) {
            throw new Error(
              `token 可以读取账号，但无法访问 KV：请为它添加「Workers KV Storage → Edit」权限。${error.message}`,
            )
          }

          const config = readFileSync('wrangler.jsonc', 'utf8')
          const d1Name = config.match(/"database_name":\s*"([^"]+)"/)?.[1]
          const kvTitle = 'saas-template-cache'
          if (!d1Name) throw new Error('wrangler.jsonc 中缺少 database_name')

          const databases = await api(`/accounts/${accountId}/d1/database`)
          let d1 = databases.find((db) => db.name === d1Name)
          if (!d1) {
            console.log(`创建 D1 数据库 ${d1Name}`)
            d1 = await api(`/accounts/${accountId}/d1/database`, {
              method: 'POST',
              body: JSON.stringify({ name: d1Name }),
            })
          }

          const namespaces = await api(`/accounts/${accountId}/storage/kv/namespaces`)
          let kv = namespaces.find((ns) => ns.title === kvTitle)
          if (!kv) {
            console.log(`创建 KV 命名空间 ${kvTitle}`)
            kv = await api(`/accounts/${accountId}/storage/kv/namespaces`, {
              method: 'POST',
              body: JSON.stringify({ title: kvTitle }),
            })
          }

          console.log(`D1 ${d1Name} = ${d1.uuid}`)
          console.log(`KV ${kvTitle} = ${kv.id}`)

          // 回填资源 ID，保留文件内注释（wrangler --update-config 会抹掉注释）。
          const d1Pattern = /(\"database_id\":\s*\")[0-9a-f-]*(\")/
          const kvPattern = /(\"binding\": \"CACHE\", \"id\": \")[0-9a-f]*(\")/
          if (!d1Pattern.test(config) || !kvPattern.test(config)) {
            throw new Error('回填失败：wrangler.jsonc 中未找到 database_id 或 KV id 字段')
          }
          const updated = config
            .replace(d1Pattern, `$1${d1.uuid}$2`)
            .replace(kvPattern, `$1${kv.id}$2`)
          writeFileSync('wrangler.jsonc', updated)
          NODE
          # 迁移必须先于部署：Worker 启动即访问 users 表，缺表会让所有走会话的请求 500。
          echo "应用 D1 迁移"
          pnpm exec wrangler d1 migrations apply DB --remote
      - name: Validate, build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          pnpm run check:env:prod
          pnpm run build
          pnpm run check:client-bundle
          # 仅上传明确列出的运行时字段，不把 Cloudflare 部署凭据送入 Worker。
          # 临时文件权限受限，命令退出时清理；不输出任何 secret 值。
          umask 077
          secrets_file=$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module - "$secrets_file" <<'NODE'
          import { writeFileSync } from 'node:fs'
          const keys = [
            'BETTER_AUTH_SECRET', 'BETTER_AUTH_URL', 'RESEND_API_KEY', 'MAIL_FROM',
            'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET', 'DISCORD_WEBHOOK_URL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'TURNSTILE_SECRET_KEY', 'ADMIN_EMAILS',
          ]
          const bindings = Object.fromEntries(keys.filter(key => process.env[key]).map(key => [key, process.env[key]]))
          writeFileSync(process.argv[2], JSON.stringify(bindings))
          NODE
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.VITE_BASE_URL || secrets.VITE_BASE_URL }}
        run: |
          set -euo pipefail
          for path in / /docs/getting-started; do
            code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -L -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "::error::冒烟检查失败：$path 返回 $code"
              exit 1
            fi
          done
          code=$(curl --retry 3 --retry-delay 2 --max-time 30 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/get-session")
          echo "/api/auth/get-session → $code"
          case "$code" in
            2*) ;;
            *) echo "::error::认证端点响应异常，检查认证 secret 与 D1 绑定"; exit 1 ;;
          esac
