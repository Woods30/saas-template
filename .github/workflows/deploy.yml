name: Deploy

# 触发条件：CI 在 main 上**成功**之后。
#
# 用 `workflow_run` 而不是独立的 `push` 触发器，是为了让「CI 绿」成为部署的硬前置。
# 两个 workflow 各自监听 push 时，CI 红了部署照样会发——生产上跑的就是未经测试的代码。
#
# ⚠️ 安全：`workflow_run` 的经典陷阱是「pwn request」。本仓库是 **public**，任何人可 fork。
# 攻击链：
#   1. 攻击者 fork，把改动推到自建分支，分支名就叫 `main`，再向上游 `main` 开 PR；
#   2. CI 因「PR 目标为 main」而运行（`pull_request.branches` 过滤的是**基分支**）。
#      fork PR 拿不到 secret，所以 CI 本身是安全的；
#   3. CI 通过后触发本 workflow。`workflow_run.branches: [main]` 过滤的是触发运行的
#      **头分支**——即攻击者自己命名的 `main`，于是匹配成功；
#   4. 本 workflow **有生产 secret**。若此时 checkout 攻击者的 head_sha 并执行其代码
#      （`pnpm install` 会跑其 postinstall，`pnpm run deploy` 跑其 package.json），
#      攻击者就拿到了 CLOUDFLARE_API_TOKEN。
#
# 因此下面三道防线缺一不可，**不要删**：
#   1. `on.branches: [main]` 匹配的是头分支，而头分支名由 fork 方控制，**挡不住**攻击者；
#   2. job 的 `if` 必须校验 `head_repository.full_name == github.repository`——这是唯一能
#      区分「同仓库 push」与「fork PR」的条件，**真正的防线**；
#   3. `head_sha` 由 GitHub 约束为提交 SHA，不是自由文本，但仍显式校验为十六进制。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 串行部署：两次 push 快速连续触发时，若并发运行会互相覆盖。
# 不设 cancel-in-progress——部署被中途打断可能留下半新半旧的状态。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 最小权限：本 workflow 只需读仓库代码。部署凭据走下面的 env，不依赖 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 两个条件缺一不可：
    #   - conclusion == 'success'：CI 必须通过；
    #   - head_repository == 本仓库：**拒绝 fork**。fork PR 的头分支名可控，
    #     单靠 on.branches 挡不住；这一条才是真正的防线。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 20
    env:
      # 生产环境变量直接经 env 注入，**不创建 `.env.production` 文件**：
      # `check-env-prod.ts` 在文件不存在时回退到进程 env，而进程 env 优先级最高。
      # 这样 secret 不会落到 CI 磁盘上，也就没有「构建产物里残留 .env」的风险。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      # 显式校验 SHA 形状再交给 checkout。GitHub 本就把 head_sha 约束为提交 SHA，
      # 这里是纵深防御：若该字段未来出现非预期形态，宁可直接失败。
      - name: Validate ref
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::head_sha 不是合法的提交 SHA，拒绝继续"
            exit 1
          fi
      # 所有 action 固定在 commit SHA 上，而非 `@v4` 这类可变标签。
      # 标签可被上游（或攻击者经供应链）重新指向任意提交，而 SHA 不可变。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 部署 workflow_run 的 head_sha，即通过 CI 的那个提交。
          # 默认 checkout 的是默认分支最新提交，可能已包含 CI 未验证的后续提交。
          ref: ${{ github.event.workflow_run.head_sha }}
      # pnpm 版本来自 package.json 的 packageManager，不在此硬编码。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # content:build 产出 .content-collections/，是构建的前置。
      - run: pnpm run content:build
      # pnpm deploy = 生产 env 校验 → 构建 → 客户端 bundle 泄漏检查 → wrangler deploy
      - run: pnpm run deploy
      # 冒烟检查：首页与文档站必须 200。部署成功但页面 500 是最常见的静默故障
      # （如运行时 secret 缺失），只检查 wrangler 退出码抓不到。
      - name: Smoke test
        env:
          BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: |
          for path in / /docs/getting-started; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL$path")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "::error::冒烟检查失败：$BASE_URL$path 返回 $code"
              exit 1
            fi
          done
          # 认证端点返回 500 说明运行时 secret 或 D1 绑定有问题。
          # 无会话时正确响应是 200 + null，故只拒绝 5xx。
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/auth/get-session")
          echo "/api/auth/get-session → $code"
          case "$code" in
            5*) echo "::error::认证端点返回 $code，检查 BETTER_AUTH_SECRET 与 D1 绑定"; exit 1 ;;
          esac
