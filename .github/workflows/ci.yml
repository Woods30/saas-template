name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.core.outputs.core }}
    steps:
      # fetch-depth: 0 必须：浅克隆下 origin/<base_ref> 无法解析，核心区判定会失败。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # check-core-changed 是三态退出码：0=核心区，1=非核心，2=无法判定。
      # 2 必须显式失败——写成 if/else 会让它落进 else → core=false → e2e 被静默跳过。
      - id: core
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          pnpm exec tsx scripts/check-core-changed.ts "origin/$BASE_REF"
          code=$?
          set -e
          case "$code" in
            0) echo "core=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "core=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::无法判定核心区（check-core-changed 退出码 $code），拒绝静默跳过 e2e"
              exit "$code"
              ;;
          esac

  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      - run: pnpm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # 仅核心区改动，或 push 到 main 时跑全量 e2e；普通 PR 跳过。
    if: needs.changes.outputs.core == 'true' || github.event_name == 'push'
    env:
      E2E_BASE_URL: http://localhost:3000
      # 本 job 自己起 dev server；不设此变量 Playwright 会再起一个，两个 server 抢端口。
      E2E_NO_SERVER: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 复用 build job 的产物，避免重复构建。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: dist/
      # 必须有 `.env`：wrangler.jsonc 的 vars 把 NODE_ENV 定为 production，缺 `.env`
      # 时 better-auth 会拒绝默认 secret，所有走会话的用例全部 500。
      - name: Create .env
        # 仅给 E2E 本地邮件捕获服务使用，不能配置真实发信凭证。
        run: |
          cp .env.example .env
          printf '\nRESEND_API_KEY=re_e2e_synthetic_never_send\nMAIL_FROM=e2e@example.invalid\n' >> .env
      # CI 的 D1 是全新空库，不建表则 `sign-up` 报 no such table: users，走会话的
      # 用例整片超时。
      - name: Apply D1 migrations
        run: pnpm run db:migrate:local
      - name: Start server
        run: pnpm exec tsx e2e/global-setup.ts &
        env:
          CI: true
      - name: Wait for server
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:3000/__e2e/mail-transport > /dev/null; then
              echo "Server ready"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"; exit 1
      - run: pnpm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
