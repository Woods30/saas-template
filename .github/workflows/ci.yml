name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.core.outputs.core }}
    steps:
      # fetch-depth: 0 必须：浅克隆下 origin/<base_ref> 无法解析，
      # check-core-changed 会以退出码 2（无法判定）失败。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 复用 scripts/core-paths.ts：命中核心区 → core=true。
      #
      # check-core-changed 是三态退出码：0=命中核心区，1=确属非核心，2=**无法判定**
      # （base ref 无效 / 无 merge base 致 diff 失败）。必须三路分支：若写成
      # `if ...; then true; else false; fi`，退出码 2 会落进 else → core=false →
      # e2e 被静默跳过（fail-open）。故 2 必须显式失败，绝不折算成 core=false。
      - id: core
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          pnpm exec tsx scripts/check-core-changed.ts "origin/$BASE_REF"
          code=$?
          set -e
          case "$code" in
            0) echo "core=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "core=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::无法判定核心区（check-core-changed 退出码 $code），拒绝静默跳过 e2e"
              exit "$code"
              ;;
          esac

  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run content:build
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  e2e:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # 仅核心区改动，或 push 到 main 时跑全量 e2e；普通 PR 跳过。
    if: needs.changes.outputs.core == 'true' || github.event_name == 'push'
    env:
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 复用 build job 的产物，避免 e2e job 内重复 content:build + build。
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/
      # 启动 dev server；playwright.config.ts 的 webServer.command 接管生命周期
      - name: Start server
        run: pnpm run dev --port 3000 &
        env:
          CI: true
      - name: Wait for server
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Server ready"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"; exit 1
      - run: pnpm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
